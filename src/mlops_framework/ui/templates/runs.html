<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Runs · MLOps</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <h1>MLOps</h1>
    <nav class="main-nav">
      <a href="/dashboard">Dashboard</a>
      <a href="/datasets">Datasets</a>
      <a href="/runs" class="active">Runs</a>
      <a href="/models">Models</a>
      <a href="/lineage">Lineage</a>
    </nav>
  </header>
  <main>
    <h2>Training runs</h2>
    <p class="subtitle">Select two or more runs to compare their parameters and metrics.</p>
    <div class="toolbar">
      <input type="search" id="search" placeholder="Filter by id, pipeline, orchestrator…" size="34">
      <select id="status-filter">
        <option value="">All statuses</option>
        <option value="PENDING">Pending</option>
        <option value="RUNNING">Running</option>
        <option value="SUCCESS">Success</option>
        <option value="FAILED">Failed</option>
        <option value="CANCELLED">Cancelled</option>
      </select>
      <button id="refresh">Refresh</button>
      <span class="spacer"></span>
      <button id="compare-btn" class="primary" disabled>Compare runs</button>
    </div>
    <div class="table-wrap">
      <table><thead><tr></tr></thead><tbody></tbody></table>
    </div>
  </main>
  <script src="/static/app.js"></script>
  <script>initRuns();</script>
</body>
</html>
