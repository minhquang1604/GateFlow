    <div class="page-header">
      <div>
        <h1 class="page-title">Dashboard</h1>
        <p class="page-desc">Datasets, training runs and models tracked by this framework.</p>
      </div>
      <div class="page-actions">
        <button class="btn" data-action="reload">Refresh</button>
        <a class="btn primary" href="/runs">View training runs</a>
      </div>
    </div>

    <div id="kpi-grid" class="kpi-grid" style="margin-bottom:20px"></div>

    <!-- Three equal-width tiles (grid-3's default row-stretch), each
         built by initDashboard() as chart-title + a vertically-centred
         body (see .dash-tile-body) — so a 4-row key-value list, a
         donut, and a table end up the same height without the shorter
         ones trailing into a block of empty space at the bottom. -->
    <div class="grid-3" style="margin-bottom:20px">
      <div id="inventory-card"></div>
      <div id="outcomes-chart"></div>
      <div id="models-card"></div>
    </div>

    <h3>Activity</h3>
    <div id="recent-runs"></div>
<script>initDashboard();</script>
