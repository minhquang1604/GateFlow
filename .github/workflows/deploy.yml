name: Build, push, and deploy

# Builds the three custom images (mlflow, airflow, and app — used by
# app/serving), pushes them to the ECR repositories created by
# Terraform (infrastructure/terraform/modules/ecr), then forces each
# ECS service onto the new image.
#
# airflow and app are deliberately separate images, not one shared
# image: Airflow 2.10.4 pins SQLAlchemy 1.4.x internally and cannot
# tolerate the framework's sqlalchemy>=2.0.0 requirement in the same
# Python environment. See infrastructure/airflow/Dockerfile's header
# comment for the full explanation.
#
# Terraform never builds or pushes images (see
# infrastructure/terraform/environments/prod/README.md) — this
# workflow is the other half of the deploy story. On a fresh
# `terraform apply`, ECS services are created pointed at `:latest`,
# which doesn't exist in ECR yet; run this workflow (push to main, or
# `gh workflow run deploy.yml`) to populate it.

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/mlflow/**"
      - "infrastructure/airflow/**"
      - "infrastructure/app/**"
      - "case_studies/**"
      - "src/**"
      - "pyproject.toml"
      # Changes what lands inside the images, so it must retrigger a build.
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
  ECR_MLFLOW_REPOSITORY: ${{ vars.ECR_MLFLOW_REPOSITORY }}
  ECR_AIRFLOW_REPOSITORY: ${{ vars.ECR_AIRFLOW_REPOSITORY }}
  ECR_APP_REPOSITORY: ${{ vars.ECR_APP_REPOSITORY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    permissions:
      contents: read
      id-token: write # for OIDC, if configured instead of access keys
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          # OIDC alternative (production-hardened, no long-lived keys):
          # role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ECR_*_REPOSITORY vars are full repo URIs (registry host + repo
      # name, e.g.
      # 123456789012.dkr.ecr.us-east-1.amazonaws.com/mlops-framework/app
      # — the same value `terraform output ecr_repositories` prints).
      # Do not re-prefix with steps.ecr-login.outputs.registry here;
      # that would double up the registry host in the tag.
      - name: Build and push mlflow image
        uses: docker/build-push-action@v6
        with:
          context: infrastructure/mlflow
          push: true
          tags: |
            ${{ env.ECR_MLFLOW_REPOSITORY }}:${{ steps.tag.outputs.tag }}
            ${{ env.ECR_MLFLOW_REPOSITORY }}:latest

      # No framework install — see infrastructure/airflow/Dockerfile's
      # header comment (SQLAlchemy 1.4 vs 2.0 conflict with Airflow).
      - name: Build and push airflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/airflow/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_AIRFLOW_REPOSITORY }}:${{ steps.tag.outputs.tag }}
            ${{ env.ECR_AIRFLOW_REPOSITORY }}:latest

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/app/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_APP_REPOSITORY }}:${{ steps.tag.outputs.tag }}
            ${{ env.ECR_APP_REPOSITORY }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployment on each ECS service
        run: |
          for service in mlflow airflow-webserver airflow-scheduler app serving; do
            echo "Deploying $service ..."
            aws ecs update-service \
              --cluster "${ECS_CLUSTER_NAME}" \
              --service "$service" \
              --force-new-deployment \
              --output text
          done

      # Not `aws ecs wait services-stable`: its waiter is hardcoded to
      # 40 attempts x 15s = 10 minutes, with no CLI flag to raise it,
      # and it prints only "Max attempts exceeded" — no indication of
      # which service was still moving or why. This stack redeploys
      # right at that boundary (deployment_maximum_percent = 100 stops
      # the old task before starting the new one, and
      # airflow-webserver alone has a 300s health-check start period),
      # so the waiter failed the run repeatedly while the deploy was
      # in fact progressing normally.
      - name: Wait for services to stabilize
        env:
          TIMEOUT_SECONDS: "1200"
        run: |
          set -uo pipefail
          services="mlflow airflow-webserver airflow-scheduler app serving"
          deadline=$(( $(date +%s) + TIMEOUT_SECONDS ))

          while :; do
            unstable=""
            for s in ${services}; do
              read -r desired running pending deployments <<<"$(
                aws ecs describe-services \
                  --cluster "${ECS_CLUSTER_NAME}" --services "$s" \
                  --query 'services[0].[desiredCount,runningCount,pendingCount,length(deployments)]' \
                  --output text
              )"
              if [ "$running" != "$desired" ] || [ "$pending" != "0" ] || [ "$deployments" != "1" ]; then
                unstable="${unstable} ${s}(running=${running}/${desired},pending=${pending},deployments=${deployments})"
              fi
            done

            if [ -z "$unstable" ]; then
              echo "All services stable."
              exit 0
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Still unstable after ${TIMEOUT_SECONDS}s:${unstable}"
              for s in ${services}; do
                echo "--- $s (last 5 events) ---"
                aws ecs describe-services --cluster "${ECS_CLUSTER_NAME}" --services "$s" \
                  --query 'services[0].events[:5].message' --output text | tr '\t' '\n'
              done
              exit 1
            fi

            echo "waiting:${unstable}"
            sleep 20
          done
