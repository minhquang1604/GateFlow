# docker-compose.yml for the MLOps Framework stack.
#
# Brings up everything required to demonstrate the full MLOps
# lifecycle against real services:
#
#   * postgres    — shared metadata database (framework + MLflow backend store)
#   * minio       — S3-compatible artifact store for MLflow models / files
#   * mlflow      — tracking server with a PostgreSQL backend and MinIO artifacts
#   * airflow     — webserver + scheduler that run the framework's DAGs
#   * app         — FastAPI Management API + UI (port 8000)
#   * serving     — FastAPI ServingBridge (port 8001)
#   * demo        — one-shot end-to-end runner (profile: demo)
#
# All inter-service traffic flows over the `mlops_network` bridge
# network. The host only needs to publish Postgres (5432), MLflow
# (5000), Airflow (8080), MinIO console (9001), app (8000), and
# serving (8001).

services:

  # ------------------------------------------------------------------ #
  # PostgreSQL — shared metadata store                                 #
  # ------------------------------------------------------------------ #
  postgres:
    image: postgres:15-alpine
    container_name: mlops_framework_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: mlops_framework,mlflow,airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sh:/docker-entrypoint-initdb.d/20-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mlops_network

  # ------------------------------------------------------------------ #
  # MinIO — S3-compatible artifact store for MLflow                     #
  # ------------------------------------------------------------------ #
  minio:
    image: minio/minio:RELEASE.2024-10-29T16-01-48Z
    container_name: mlops_framework_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mlops_network

  minio-init:
    image: minio/mc:RELEASE.2024-10-29T15-34-59Z
    container_name: mlops_framework_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      if ! mc ls local/mlflow-artifacts >/dev/null 2>&1; then
        mc mb local/mlflow-artifacts;
        echo 'created bucket mlflow-artifacts';
      else
        echo 'bucket mlflow-artifacts already exists';
      fi;
      "
    networks:
      - mlops_network

  # ------------------------------------------------------------------ #
  # MLflow tracking server                                              #
  # ------------------------------------------------------------------ #
  mlflow:
    build:
      context: ./infrastructure/mlflow
    container_name: mlops_framework_mlflow
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mlflow
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MLFLOW_BUCKET: mlflow-artifacts
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - mlops_network

  # ------------------------------------------------------------------ #
  # Airflow — webserver                                                #
  #                                                                     #
  # `command: webserver` is passed to infrastructure/airflow/entrypoint.sh, #
  # which runs the (idempotent) db migrate + admin user create before  #
  # exec'ing the webserver — no separate init container needed.        #
  # ------------------------------------------------------------------ #
  airflow-webserver:
    build:
      context: .
      dockerfile: infrastructure/airflow/Dockerfile
    container_name: mlops_framework_airflow_webserver
    restart: unless-stopped
    user: airflow
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: "GhJxaqxV4I0RqG3k2R0eL7oJ-XyY9wM1xK4Ud3oI8eg="
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "MLOPS_FRAMEWORK_SECRET"
      # The DAG calls /api/internal/* on the app, which is gated — see
      # the app service's own CONSOLE_WRITE_TOKEN comment and
      # dags/mlops_training_pipeline.py's _internal_headers().
      CONSOLE_WRITE_TOKEN: ${CONSOLE_WRITE_TOKEN:-dev-console-token}
      AIRFLOW__API__AUTH_BACKEND: airflow.api.auth.backend.basic_auth
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW_ADMIN_USERNAME: airflow
      AIRFLOW_ADMIN_PASSWORD: airflow
      # The MLflow *client* (used by case_studies pipelines' log_artifact
      # calls) talks to MinIO's S3 API directly, bypassing the mlflow
      # server — so every container that logs an MLflow artifact needs
      # these, not just the `mlflow` service itself. Missing them fails
      # log_artifact with a silent AccessDenied (swallowed by the
      # pipeline's broad except), not a crash — easy to miss.
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command: webserver
    ports:
      - "8080:8080"
    volumes:
      # No /opt/airflow/dags volume here on purpose — DAGs are baked
      # into the image (see infrastructure/airflow/Dockerfile's header
      # comment) so local behaviour matches ECS, which has no volume
      # mount either. A named volume here previously shadowed the
      # image's baked-in DAG folder permanently after its first
      # creation: every later `docker compose build` silently stopped
      # updating the running DAG file, since Docker only seeds a named
      # volume from the image on the volume's *first* creation, never
      # again after. Edit the DAG, rebuild this image, recreate the
      # container — no volume to clear in between.
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
      - ./infrastructure/airflow/dags:/opt/airflow/dags_local:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-u", "airflow:airflow", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks:
      - mlops_network

  # ------------------------------------------------------------------ #
  # Airflow — scheduler                                                #
  #                                                                     #
  # `command: scheduler` waits (inside entrypoint.sh) for the          #
  # webserver's migrate to complete before starting.                   #
  # ------------------------------------------------------------------ #
  airflow-scheduler:
    build:
      context: .
      dockerfile: infrastructure/airflow/Dockerfile
    container_name: mlops_framework_airflow_scheduler
    restart: unless-stopped
    user: airflow
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: "GhJxaqxV4I0RqG3k2R0eL7oJ-XyY9wM1xK4Ud3oI8eg="
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "MLOPS_FRAMEWORK_SECRET"
      # The DAG calls /api/internal/* on the app, which is gated — see
      # the app service's own CONSOLE_WRITE_TOKEN comment and
      # dags/mlops_training_pipeline.py's _internal_headers().
      CONSOLE_WRITE_TOKEN: ${CONSOLE_WRITE_TOKEN:-dev-console-token}
      # See airflow-webserver's comment — LocalExecutor runs tasks as
      # scheduler subprocesses, so this is the container that actually
      # needs these when train_xgboost calls mlflow.log_artifact().
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command: scheduler
    volumes:
      # See airflow-webserver's volumes comment — no dags volume here,
      # on purpose.
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
      - ./infrastructure/airflow/dags:/opt/airflow/dags_local:ro
    depends_on:
      airflow-webserver:
        condition: service_healthy
    networks:
      - mlops_network

  # ------------------------------------------------------------------ #
  # Framework Management API + UI                                      #
  # ------------------------------------------------------------------ #
  app:
    build:
      context: .
      dockerfile: infrastructure/app/Dockerfile
    container_name: mlops_framework_app
    restart: unless-stopped
    command: >
      /bin/bash -c "
      cd /opt/framework;
      PYTHONPATH=/opt/framework/src alembic upgrade head;
      uvicorn mlops_framework.api.app:create_app --factory --host 0.0.0.0 --port 8000;
      "
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/mlops_framework
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: mlops-framework
      AIRFLOW_BASE_URL: http://airflow-webserver:8080
      AIRFLOW_USERNAME: airflow
      AIRFLOW_PASSWORD: airflow
      SERVING_BRIDGE_URL: http://serving:8001
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      SCHEDULER_ENABLED: "true"
      # Shared secret gating every write endpoint (/api/internal/* and
      # the write half of /api/schedules) — see
      # mlops_framework/api/security.py. The gate fails closed, so this
      # is not optional: without it those routes answer 503 and the
      # Airflow DAG cannot report back. The default below is a
      # development value; set CONSOLE_WRITE_TOKEN in .env.docker (and
      # anywhere reachable from outside a laptop) to something else.
      CONSOLE_WRITE_TOKEN: ${CONSOLE_WRITE_TOKEN:-dev-console-token}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
      serving:
        condition: service_started
    networks:
      - mlops_network

  # ------------------------------------------------------------------ #
  # FastAPI ServingBridge — receives reloads from promotion events     #
  # ------------------------------------------------------------------ #
  serving:
    build:
      context: .
      dockerfile: infrastructure/app/Dockerfile
    container_name: mlops_framework_serving
    restart: unless-stopped
    command: >
      /bin/bash -c "
      cd /opt/framework;
      PYTHONPATH=/opt/framework/src python -m mlops_framework.serving.run --host 0.0.0.0 --port 8001;
      "
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/mlops_framework
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mlops_network

  # ------------------------------------------------------------------ #
  # Demo — one-shot end-to-end runner                                  #
  # ------------------------------------------------------------------ #
  demo:
    build:
      context: .
      dockerfile: infrastructure/app/Dockerfile
    container_name: mlops_framework_demo
    profiles: ["demo"]
    command: >
      /bin/bash -c "
      cd /opt/framework;
      PYTHONPATH=/opt/framework/src python -m scripts.run_end_to_end_demo;
      "
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/mlops_framework
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: mlops-framework
      AIRFLOW_BASE_URL: http://airflow-webserver:8080
      AIRFLOW_USERNAME: airflow
      AIRFLOW_PASSWORD: airflow
      SERVING_BRIDGE_URL: http://serving:8001
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
      serving:
        condition: service_started
    networks:
      - mlops_network

volumes:
  postgres_data:
  minio_data:
  airflow_logs:
  airflow_plugins:

networks:
  mlops_network:
    name: mlops_network
    driver: bridge
