[project]
name = "mlops-framework"
version = "0.1.0"
description = "A reusable MLOps Framework for managing datasets, training runs, and model lifecycle"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "minhquang1604", email = "caominhquang1604@gmail.com" }
]
keywords = ["mlops", "machine-learning", "data-pipeline", "training", "ml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "scipy>=1.10.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "mlflow>=2.20.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "boto3>=1.34.0",
    "croniter>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "UP042", # str+Enum -> enum.StrEnum: changes str(member) from "Cls.MEMBER"
             # to the bare value, a real behavior change for anything that
             # logs/serializes these enums today — needs its own reviewed
             # change, not a lint sweep.
]

[tool.ruff.lint.isort]
known-first-party = ["mlops_framework"]

[tool.pytest.ini_options]
testpaths = ["tests", "case_studies"]
asyncio_mode = "auto"
